[project]
name = "refhub"
version = "0.7.0"
description = "Hub de datos de referencia de terceros: golden copy de empresas e instrumentos (GLEIF, OpenFIGI, SEC EDGAR) con catálogo de datasets y licencias legibles por máquina (DCAT y ODRL)."
readme = "README.md"
authors = [
    { name = "Luis Alberto Rodriguez", email = "alberto.rodriguezaguilar@ingenieria.uner.edu.ar" }
]
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
refhub = "refhub:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
# Gold con dbt (carpeta dbt/). Va en un grupo aparte y no en las dependencias del paquete: el
# .whl que usan Glue y la Lambda no tiene que llevar dbt. Fusion (el dbt nuevo) no soporta
# Athena, por eso dbt-core 1.12 con el adaptador de Athena 1.11.
dbt = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-athena>=1.11.1,<1.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errores, imports ordenados, sintaxis moderna, bugs comunes

[tool.pytest.ini_options]
testpaths = ["tests"]
