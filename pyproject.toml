[project]
name = "refhub"
version = "0.15.0"
description = "Hub de datos de referencia de terceros: golden copy de empresas e instrumentos (GLEIF, OpenFIGI, SEC EDGAR) con catálogo de datasets y licencias legibles por máquina (DCAT y ODRL)."
readme = "README.md"
authors = [
    { name = "Luis Alberto Rodriguez", email = "alberto.rodriguezaguilar@ingenieria.uner.edu.ar" }
]
requires-python = ">=3.11,<3.13"
dependencies = []

# La dependencia va donde se usa. rdflib solo la necesita el evaluador de licencias, que corre en
# el CI para compilar decisiones.json (ADR 0012): ni los jobs de Glue ni la Lambda de la API la
# instalan.
[project.optional-dependencies]
licencias = ["rdflib>=7.6"]

[project.scripts]
refhub = "refhub:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # El propio paquete con el extra: `uv run` (en local) y `uv sync --all-groups` (en el CI)
    # instalan el grupo dev, así los tests de licencias tienen rdflib sin cambiar el workflow.
    "refhub[licencias]",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
# Gold con dbt (carpeta dbt/). Va en un grupo aparte y no en las dependencias del paquete: el
# .whl que usan Glue y la Lambda no tiene que llevar dbt. Fusion (el dbt nuevo) no soporta
# Athena, por eso dbt-core 1.12 con el adaptador de Athena 1.11.
dbt = [
    "dbt-core>=1.12.5,<1.13",
    "dbt-athena>=1.11.1,<1.12",
]
# Los consumidores locales de la golden copy (carpeta local/, ADR 0014): exportar de Athena y
# cargar Oracle. oracledb en modo thin habla con la base directo, sin instalar el Instant Client.
# OpenSearch se carga por HTTP con la biblioteca estándar: no hace falta un cliente.
local = [
    "boto3>=1.40",
    "oracledb>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errores, imports ordenados, sintaxis moderna, bugs comunes

[tool.pytest.ini_options]
testpaths = ["tests"]
