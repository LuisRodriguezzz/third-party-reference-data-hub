[project]
name = "refhub"
version = "0.9.0"
description = "Hub de datos de referencia de terceros: golden copy de empresas e instrumentos (GLEIF, OpenFIGI, SEC EDGAR) con catálogo de datasets y licencias legibles por máquina (DCAT y ODRL)."
readme = "README.md"
authors = [
    { name = "Luis Alberto Rodriguez", email = "alberto.rodriguezaguilar@ingenieria.uner.edu.ar" }
]
requires-python = ">=3.11,<3.13"
dependencies = []

# La dependencia va donde se usa. rdflib solo la necesita el evaluador de licencias (y la futura
# Lambda de la API, que la empaqueta): los jobs de Glue instalan el .whl sin extras y no la bajan.
[project.optional-dependencies]
licencias = ["rdflib>=7.6"]

[project.scripts]
refhub = "refhub:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # El propio paquete con el extra: `uv run` (en local) y `uv sync --all-groups` (en el CI)
    # instalan el grupo dev, así los tests de licencias tienen rdflib sin cambiar el workflow.
    "refhub[licencias]",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errores, imports ordenados, sintaxis moderna, bugs comunes

[tool.pytest.ini_options]
testpaths = ["tests"]
