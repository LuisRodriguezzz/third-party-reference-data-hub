# Lo que gold lee: las tablas de silver. Las crean y validan los jobs de Glue (su esquema está en
# src/refhub/ddl/), así que acá solo se nombran: dbt no las construye ni las vuelve a describir.
version: 2

sources:
  - name: silver
    schema: "refhub_silver_{{ target.name }}"
    tables:
      - name: gleif_lei
        description: Una fila por LEI, la última versión publicada por GLEIF.
      - name: gleif_isin_lei
        description: Una fila por ISIN, con el LEI de la empresa que lo emitió (GLEIF y ANNA).
      - name: sec_empresas
        description: Las empresas que cotizan en EE. UU. según la SEC, una fila por ticker.
      - name: gleif_relaciones
        description: >
          Las relaciones de GLEIF (nivel 2), la última foto completa: una fila por child_lei y
          relationship_type, con la controlante, la gestora o la casa matriz en parent_lei.
      - name: openfigi_tickers
        description: >
          Una fila por ISIN de acciones de EE. UU. mandado a OpenFIGI, con su FIGI y su ticker
          (nulos si OpenFIGI no devolvió nada; ver resultados y motivo).
      # Las que lee el scorecard (scorecard_fuentes): las otras tablas de silver y sus cuarentenas.
      - name: gleif_archivos_procesados
        description: Los archivos de bronze que el job de silver de GLEIF ya procesó, con sus filas rechazadas.
      - name: gleif_isin_lei_cuarentena
        description: Las filas de ISIN↔LEI que no cumplieron el contrato, con el motivo.
      - name: sec_empresas_cuarentena
        description: Las filas de la SEC que no cumplieron el contrato, con el motivo.
      - name: gleif_relaciones_cuarentena
        description: Las filas de relaciones que no cumplieron el contrato, con el motivo.
