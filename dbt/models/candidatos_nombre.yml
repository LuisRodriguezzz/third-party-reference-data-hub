version: 2

models:
  - name: candidatos_nombre
    description: >
      Camino por nombre: los LEIs cuyo nombre normalizado es igual al de la empresa en la SEC
      (sin contar los nombres vacíos). Una fila por par (cik, lei).
    columns:
      - name: cik
        data_type: varchar
        description: CIK de la SEC, 10 dígitos con ceros adelante.
        data_tests: [not_null]
      - name: lei
        data_type: varchar
        description: LEI de GLEIF con el mismo nombre normalizado.
        data_tests: [not_null]

unit_tests:
  # Chevron no tiene LEI; CHEVRON LIMITED (Malta) normaliza igual pero no es candidato: es
  # extranjera y no emitió títulos. La extranjera que sí emitió (Toyota) entra.
  - name: homonimo_extranjero_sin_titulos_no_es_candidato
    model: candidatos_nombre
    given:
      - input: source('silver', 'sec_empresas')
        rows:
          - { cik: "0000093410", nombre_normalizado: CHEVRON }
          - { cik: "0001094517", nombre_normalizado: TOYOTA MOTOR }
      - input: source('silver', 'gleif_lei')
        rows:
          - { lei: LEI_CHEVRON_MALTA, nombre_normalizado: CHEVRON, country: MT }
          - { lei: LEI_TOYOTA, nombre_normalizado: TOYOTA MOTOR, country: JP }
      - input: source('silver', 'gleif_isin_lei')
        rows:
          - { isin: US8923313071, lei: LEI_TOYOTA }
    expect:
      rows:
        - { cik: "0001094517", lei: LEI_TOYOTA }

  # Los nombres vacíos (alfabetos no latinos) no coinciden entre sí.
  - name: nombres_vacios_no_cruzan
    model: candidatos_nombre
    given:
      - input: source('silver', 'sec_empresas')
        rows:
          - { cik: "0000000005", nombre_normalizado: "" }
      - input: source('silver', 'gleif_lei')
        rows:
          - { lei: LEI_VACIO, nombre_normalizado: "", country: US }
      - input: source('silver', 'gleif_isin_lei')
        rows: []
    expect:
      rows: []
